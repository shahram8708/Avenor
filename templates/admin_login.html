<!doctype html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Admin Login | Avenor</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=Sora:wght@600;700;800&display=swap" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet" >
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
    <link rel="stylesheet" href="{{ url_for('static', filename='css/custom.css') }}">
</head>
<body class="admin-body">
    <section class="admin-login-section">
        <div class="container">
            <div class="row justify-content-center">
                <div class="col-md-7 col-lg-5 col-xl-4">
                    <div class="glass-card admin-login-card">
                        <div class="text-center mb-3">
                            <img src="{{ url_for('static', filename='img/logo_avenor.png') }}" alt="Avenor" class="admin-login-logo">
                        </div>
                        <h1 class="h3 text-center mb-2">Admin Access</h1>
                        <p class="text-secondary text-center mb-4">Sign in to view waitlist analytics and registrants.</p>

                        {% with messages = get_flashed_messages(with_categories=true) %}
                            {% if messages %}
                                {% for category, message in messages %}
                                    <div class="alert alert-{{ category }} alert-dismissible fade show" role="alert">
                                        {{ message }}
                                        <button type="button" class="btn-close" data-bs-dismiss="alert" aria-label="Close"></button>
                                    </div>
                                {% endfor %}
                            {% endif %}
                        {% endwith %}

                        <form action="{{ url_for('admin_login_post') }}" method="post" novalidate>
                            <div class="mb-3">
                                <label class="form-label" for="email">Admin Email</label>
                                <input type="email" id="email" name="email" class="form-control" autocomplete="username" required>
                            </div>
                            <div class="mb-4">
                                <label class="form-label" for="password">Password</label>
                                <input type="password" id="password" name="password" class="form-control" autocomplete="current-password" required>
                            </div>
                            <button type="submit" class="btn btn-cta w-100">Log In</button>
                        </form>

                        <div class="text-center mt-4">
                            <a class="link-primary text-decoration-none" href="{{ url_for('index') }}"><i class="bi bi-arrow-left"></i> Back to Avenor Landing Page</a>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </section>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js" ></script>
</body>
</html>
